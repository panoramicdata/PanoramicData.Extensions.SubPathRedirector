name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: [pdl-test-cluster]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # Nerdbank.GitVersioning computes the version from git history, so a shallow clone fails the build.
        fetch-depth: 0

    # CodeQL autobuild needs a .NET SDK; GitHub-hosted images preinstall one, our runner image does not.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      env:
        # The runner user cannot write the default /usr/share/dotnet (OPS-157449).
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 10.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
